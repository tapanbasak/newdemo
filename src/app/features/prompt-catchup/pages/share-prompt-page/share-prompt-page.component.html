<div class="share-page">
  <aside class="share-sidebar">
    <div class="sidebar-search">
      <input
        type="text"
        class="sidebar-search-input"
        placeholder="Search for Prompts"
      />
    </div>
    <nav class="sidebar-nav">
      <a [routerLink]="['/prompt-catchup/share']" class="sidebar-link active">
        Share your Prompt
      </a>
      <a [routerLink]="['/prompt-catchup']" class="sidebar-link">Home</a>
    </nav>
  </aside>

  <main class="share-main">
    <h1 class="page-title">Share Your Prompt</h1>

    <section class="section">
      <h2 class="section-title">Basic Information</h2>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="grid-row">
          <div class="field">
            <label>Title</label>
            <input type="text" formControlName="title" />
          </div>
          <div class="field">
            <label>Created by</label>
            <input type="text" formControlName="createdBy" />
          </div>
          <div class="field">
            <label>Created by SOEID</label>
            <input type="text" formControlName="createdBySoeid" />
          </div>
        </div>

        <div class="grid-row">
          <div class="field wide">
            <label>Who could make use of this Prompt? (e.g., roles, agents)</label>
            <input type="text" formControlName="audience" />
          </div>
          <div class="field">
            <label>Attachments</label>
            <select formControlName="attachments">
              <option value="">None</option>
              <option value="doc">Design Doc</option>
              <option value="sop">SOP</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>Prompt</label>
          <textarea
            rows="4"
            formControlName="prompt"
            placeholder='Please ensure to define the variable fields with "[]" for "template" format prompts'
          ></textarea>
        </div>

        <div class="field">
          <label>Description</label>
          <textarea
            rows="3"
            formControlName="description"
            placeholder="How it works, how to use it, and how to get the most from it."
          ></textarea>
        </div>

        <div class="submit-row">
          <button type="submit" class="submit-btn">
            Submit
          </button>
        </div>
      </form>
    </section>
  </main>
</div>
