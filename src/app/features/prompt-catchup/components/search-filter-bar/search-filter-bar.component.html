<div class="filter-bar">
  <mat-form-field appearance="outline" class="filter-field search-field">
    <mat-label>Search prompts</mat-label>
    <input
      matInput
      [(ngModel)]="search"
      (ngModelChange)="onSearchInput()"
      placeholder="Search by name or description..."
    />
    <!-- <mat-icon matPrefix>search</mat-icon> -->
  </mat-form-field>

  <mat-form-field appearance="outline" class="filter-field">
    <mat-label>Status</mat-label>
    <mat-select [(ngModel)]="status" (ngModelChange)="onStatusChange()">
      <mat-option value="all">All Statuses</mat-option>
      <mat-option value="adopt">Adopt</mat-option>
      <mat-option value="under_evaluation">Under Evaluation</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="filter-field">
    <mat-label>Sort by</mat-label>
    <mat-select [(ngModel)]="sort" (ngModelChange)="onSortChange()">
      <mat-option value="most_prompts">Most Prompts</mat-option>
      <mat-option value="newest">Newest</mat-option>
      <mat-option value="alphabetical">Alphabetical</mat-option>
    </mat-select>
  </mat-form-field>

  <button mat-stroked-button class="clear-btn" (click)="onClearAll()">
    <!-- <mat-icon>clear</mat-icon> -->
    Clear All
  </button>
</div>
