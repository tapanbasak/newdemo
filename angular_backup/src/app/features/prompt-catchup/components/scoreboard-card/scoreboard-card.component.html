<div class="scoreboard-card">
  <h3 class="scoreboard-title">{{ data.title }}</h3>
  <table class="scoreboard-table">
    <thead>
      <tr>
        @for (col of data.columns; track col) {
          <th>{{ col }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of data.rows; track row.ranking) {
        <tr>
          <td class="rank-cell">{{ row.ranking }}</td>
          <td class="name-cell">
            <a href="javascript:void(0)">{{ row.name }}</a>
          </td>
          <td class="value-cell">{{ row.value }}</td>
        </tr>
      }
    </tbody>
  </table>
  @if (data.footnote) {
    <p class="scoreboard-footnote">{{ data.footnote }}</p>
  }
</div>
